[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The function's custom /api/contact route takes precedence over this SPA fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
